name: Build release artifacts

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (must match the checked-out manifests)
        required: true
        default: "1.3.0"
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Build Windows x64 artifacts
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Validate requested version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            if ($env:RELEASE_REF -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tag must use vMAJOR.MINOR.PATCH; received '$env:RELEASE_REF'"
            }
            $version = $Matches.version
          } else {
            if ($env:MANUAL_VERSION -notmatch '^\d+\.\d+\.\d+$') {
              throw "Version must use MAJOR.MINOR.PATCH; received '$env:MANUAL_VERSION'"
            }
            $version = $env:MANUAL_VERSION
          }

          $cargoManifest = Get-Content Cargo.toml -Raw
          $cargoMatch = [regex]::Match(
            $cargoManifest,
            '(?ms)^\[workspace\.package\].*?^version\s*=\s*"(?<version>[^"]+)"'
          )
          if (-not $cargoMatch.Success) {
            throw 'Could not read workspace.package.version from Cargo.toml'
          }

          $versions = [ordered]@{
            requested = $version
            cargo = $cargoMatch.Groups['version'].Value
            tauri = (Get-Content crates/app/tauri.conf.json -Raw | ConvertFrom-Json).version
            frontend = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          }
          $mismatches = $versions.GetEnumerator() | Where-Object Value -ne $version
          if ($mismatches) {
            $details = ($versions.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ', '
            throw "Build versions do not match: $details"
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($version)
          if ($changelog -notmatch "(?m)^##\s+$escapedVersion(?:\s|$)") {
            throw "CHANGELOG.md has no section for $version"
          }

          "RELEASE_VERSION=$version" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Validated release version $version" |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Cache Rust build data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-release-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-release-cargo-

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Fetch PDFium
        run: ./scripts/fetch-pdfium.ps1

      - name: Run frontend tests
        run: pnpm --dir frontend test

      - name: Run frontend checks
        run: pnpm --dir frontend check

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Import optional signing certificate
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $provided = @(
            $env:WINDOWS_CERTIFICATE_BASE64,
            $env:WINDOWS_CERTIFICATE_PASSWORD,
            $env:WINDOWS_TIMESTAMP_URL
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          if ($provided.Count -eq 0) {
            "SIGNED_BUILD=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "::warning::No signing certificate is configured; artifacts will be unsigned."
            return
          }
          if ($provided.Count -ne 3) {
            throw 'Configure all three signing secrets or none of them: WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD, and WINDOWS_TIMESTAMP_URL'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'simple-pdf-signing.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = Import-PfxCertificate `
              -FilePath $certificatePath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password `
              -Exportable
            $certificate = $imported | Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) {
              throw 'The PFX did not contain a certificate with a private key'
            }

            "SIMPLE_PDF_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "SIMPLE_PDF_TIMESTAMP_URL=$env:WINDOWS_TIMESTAMP_URL" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "SIGNED_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Build portable package
        run: ./scripts/build-portable.ps1

      - name: Build NSIS installer
        run: ./scripts/build-installer.ps1

      - name: Verify and stage artifacts
        run: |
          $portableExe = Resolve-Path 'dist/portable/simple.pdf.exe'
          $portableSource = Resolve-Path 'dist/simple.pdf-portable.zip'
          $installerSource = Resolve-Path "target/x86_64-pc-windows-msvc/release/bundle/nsis/simple.pdf_${env:RELEASE_VERSION}_x64-setup.exe"
          $artifactDir = New-Item -ItemType Directory -Force -Path 'dist/release-artifacts'
          $portableAsset = Join-Path $artifactDir "simple.pdf_${env:RELEASE_VERSION}_x64-portable.zip"
          $installerAsset = Join-Path $artifactDir "simple.pdf_${env:RELEASE_VERSION}_x64-setup.exe"

          Copy-Item -LiteralPath $portableSource -Destination $portableAsset -Force
          Copy-Item -LiteralPath $installerSource -Destination $installerAsset -Force

          $fileVersion = (Get-Item $portableExe).VersionInfo.ProductVersion
          if ($fileVersion -ne $env:RELEASE_VERSION) {
            throw "Executable version is $fileVersion, expected $env:RELEASE_VERSION"
          }

          foreach ($target in @($portableExe, $installerAsset)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($env:SIGNED_BUILD -eq 'true' -and $signature.Status -ne 'Valid') {
              throw "Expected a valid Authenticode signature on $target; status was $($signature.Status)"
            }
            if ($env:SIGNED_BUILD -ne 'true' -and $signature.Status -ne 'NotSigned') {
              throw "Expected an unsigned artifact at $target; status was $($signature.Status)"
            }
          }

          $hashLines = foreach ($target in @($installerAsset, $portableAsset)) {
            $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $target -Leaf)"
          }
          $hashLines | Set-Content -LiteralPath (Join-Path $artifactDir 'SHA256SUMS.txt') -Encoding ascii

          @"
          | Asset | Size | SHA-256 |
          | --- | ---: | --- |
          $($hashLines | ForEach-Object {
            $parts = $_ -split '  ', 2
            $asset = Join-Path $artifactDir $parts[1]
            "| $($parts[1]) | $([math]::Round((Get-Item $asset).Length / 1MB, 2)) MB | ``$($parts[0])`` |"
          } | Out-String)
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simple.pdf-${{ steps.version.outputs.version }}-windows-x64
          path: dist/release-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove imported signing certificate
        if: always() && env.SIMPLE_PDF_CERTIFICATE_THUMBPRINT != ''
        run: |
          $certificatePath = "Cert:\CurrentUser\My\$env:SIMPLE_PDF_CERTIFICATE_THUMBPRINT"
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }
